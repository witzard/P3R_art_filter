<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3R Art Filter</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 1200px; }
  .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .panel { flex: 0 0 320px; }
  .view { flex: 1 1 400px; min-width: 0; position: sticky; top: 8px; }
  fieldset { margin: 0 0 12px; padding: 8px 10px; }
  legend { font-weight: 600; }
  .row { margin-bottom: 8px; }
  .row label { display: flex; justify-content: space-between; font-size: 14px; }
  .ctl { display: flex; align-items: center; gap: 4px; }
  .ctl input[type=range] { flex: 1; min-width: 0; }
  .ctl button { width: 32px; height: 28px; padding: 0; margin: 0; font-size: 16px; }
  button { margin: 4px 4px 4px 0; padding: 6px 10px; }
  #status { color: #555; font-size: 14px; margin: 8px 0; }
  #scroller { overflow: auto; max-height: 80vh; border: 1px solid #ccc; }
  #stage { position: relative; }
  #out { display: block; width: 100%; height: auto; }
  #maskOverlay, #strokes { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #maskOverlay { pointer-events: none; }
  #strokes { pointer-events: none; }
  #strokes.painting { pointer-events: auto; touch-action: none; cursor: crosshair; }
  .modes label { display: inline-block; margin-right: 10px; font-size: 14px; }
  .hint { font-size: 12px; color: #666; }
  #presets button.active { font-weight: 600; outline: 2px solid #12acf4; }
</style>
</head>
<body>
<h2>P3R Art Filter</h2>

<div class="row">
  <input type="file" id="file" accept="image/*" disabled>
</div>
<div id="status">Loading OpenCV and background removal model...</div>

<div class="wrap">
  <div class="panel">
    <fieldset><legend>Presets</legend><div id="presets"></div></fieldset>
    <fieldset><legend>Cartoon Simplification</legend><div id="g_cartoon"></div></fieldset>
    <fieldset><legend>Hair</legend><div id="g_hair"></div></fieldset>
    <fieldset><legend>Face</legend><div id="g_face"></div></fieldset>
    <fieldset><legend>Shading</legend><div id="g_shading"></div></fieldset>
    <fieldset><legend>Line Art</legend><div id="g_lines"></div></fieldset>
    <fieldset>
      <legend>Color</legend>
      <div class="row">
        <label>Color mode
          <select id="colorMode">
            <option value="gray">Grayscale</option>
            <option value="blue">P3R blue palette</option>
          </select>
        </label>
      </div>
      <div id="g_color"></div>
      <div class="row">
        <label>Background color <input type="color" id="bg" value="#12acf4"></label>
      </div>
      <button id="reseed">Shuffle glass shards</button>
      <button id="reset">Reset to defaults</button>
    </fieldset>

    <fieldset>
      <legend>Fix background cutout</legend>
      <div class="modes row">
        <label><input type="radio" name="mode" value="view" checked> Pan/view</label>
        <label><input type="radio" name="mode" value="add"> Paint to keep</label>
        <label><input type="radio" name="mode" value="erase"> Paint to remove</label>
      </div>
      <div id="g_cutout"></div>
      <div id="brushSliders"></div>
      <label style="font-size:14px"><input type="checkbox" id="showMask"> Show removed areas (red)</label><br>
      <button id="undo" disabled>Undo</button>
      <button id="clearEdits" disabled>Clear painting</button>
      <div class="hint">Paint to keep = restore parts the AI cut off. Paint to remove = erase background the AI missed.</div>
    </fieldset>

    <label style="font-size:14px"><input type="checkbox" id="showOrig"> Show original</label><br>
    <button id="download" disabled>Download PNG (full resolution)</button>
  </div>

  <div class="view">
    <div id="scroller">
      <div id="stage">
        <canvas id="out" width="10" height="10"></canvas>
        <canvas id="maskOverlay" width="10" height="10"></canvas>
        <canvas id="strokes" width="10" height="10"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
